name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix tests/relay-contract
      - run: npm run check:sdk-drift
      - run: scripts/check.sh
      - run: npm run test:package
      - name: Install Windows packaging tools
        run: |
          case "$RUNNER_OS" in
            macOS) brew install makensis sevenzip ;;
            Windows)
              choco install nsis 7zip --yes --no-progress
              echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
              echo 'C:\Program Files\7-Zip' >> "$GITHUB_PATH"
              ;;
            Linux) sudo apt-get update && sudo apt-get install -y nsis p7zip-full ;;
          esac
      - run: node --test scripts/release.test.mjs
      - name: Build local runner
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            go build -trimpath -o dist/WebDeviceCable.exe ./cmd/webdevicecable
          else
            go build -trimpath -o dist/WebDeviceCable ./cmd/webdevicecable
          fi
      - name: Docker relay with concurrent direct transport
        if: runner.os == 'Linux'
        run: |
          docker build -f Dockerfile.relay -t wdc-relay:local .
          WDC_BINARY="$PWD/dist/WebDeviceCable" WDC_RELAY_SDK=dist/relay-client/cjs/relay.js node scripts/relay-e2e.mjs
          WDC_BINARY="$PWD/dist/WebDeviceCable" WDC_RELAY_SDK=dist/relay-client/relay.js node scripts/relay-e2e.mjs
      - run: npm run test:e2e
      - run: node scripts/cli-e2e.mjs
      - name: Linux desktop tray and runner lifecycle
        if: runner.os == 'Linux'
        run: |
          command -v dbus-daemon
          WDC_DESKTOP_BINARY="$PWD/dist/WebDeviceCable" go test -count=1 ./internal/desktop
      - name: Package this OS (community test build)
        run: |
          export WDC_RELEASE_PUBLIC_KEY=$(node --input-type=module -e "import{readFileSync}from'node:fs';import{createPublicKey}from'node:crypto';console.log(createPublicKey(readFileSync('keys/community-release.pub')).export({format:'der',type:'spki'}).subarray(-32).toString('base64'))")
          case "$RUNNER_OS" in
            macOS) python3 scripts/package.py --community --target darwin/arm64 ;;
            Windows) python scripts/package.py --community --target windows/amd64 --target windows/arm64 ;;
            Linux) python3 scripts/package.py --community --target linux/amd64 ;;
          esac
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const report = JSON.parse(readFileSync('dist/build-manifest.json'));
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(report.sourceCommit, commit);
          for (const target of report.targets) {
            const manifest = JSON.parse(readFileSync(`dist/staging/WebDeviceCable-${report.version}-${target.replace('/', '-')}/build-manifest.json`));
            assert.equal(manifest.sourceCommit, commit);
            assert.equal(manifest.automaticUpdates, false);
            assert.equal(manifest.distribution, 'community');
          }
          JS
      - name: Verify Windows install and Installed Apps removal
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-smoke.ps1
      - run: npm audit --ignore-scripts
      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
