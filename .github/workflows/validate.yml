name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:sdk-drift
      - run: scripts/check.sh
      - name: Build local runner
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            go build -trimpath -o dist/webdevicecable.exe ./cmd/webdevicecable
          else
            go build -trimpath -o dist/webdevicecable ./cmd/webdevicecable
          fi
      - run: npm run test:e2e
      - run: node scripts/cli-e2e.mjs
      - name: Linux desktop tray and runner lifecycle
        if: runner.os == 'Linux'
        run: |
          command -v dbus-daemon
          WDC_DESKTOP_BINARY="$PWD/dist/webdevicecable" go test -count=1 ./internal/desktop
      - run: npm run test:package
      - run: npm audit --ignore-scripts
      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
