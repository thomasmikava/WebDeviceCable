<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="144 62 736 736" fill="none" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">WebDeviceCable symbol</title>
  <desc id="logo-description">A circular cable encloses a globe hemisphere and a terminal prompt.</desc>
  <defs>
    <clipPath id="globe-disk"><circle cx="512" cy="430" r="313.5" /></clipPath>
    <clipPath id="globe-left"><rect x="198.5" y="116.5" width="313.5" height="627" /></clipPath>
    <clipPath id="upper-latitude"><rect x="0" y="243" width="1024" height="512" /></clipPath>
    <clipPath id="lower-latitude"><rect x="0" y="0" width="1024" height="617" /></clipPath>
  </defs>
  <g id="symbol" stroke="#101213" stroke-linecap="round" stroke-linejoin="round">
    <g clip-path="url(#globe-disk)">
      <g id="globe-grid" clip-path="url(#globe-left)" stroke-width="33">
        <path d="M 512 138.5 A 182.25 291.5 0 0 0 512 721.5" stroke-width="34" />
        <path d="M 198.5 430 H 512" />
        <ellipse cx="391.75" cy="243" rx="202" ry="67" stroke-width="29.25" clip-path="url(#upper-latitude)" />
        <ellipse cx="391.75" cy="617" rx="202" ry="67" stroke-width="29.25" clip-path="url(#lower-latitude)" />
      </g>
    </g>
    <path id="hemisphere-divider" d="M 512 116.5 V 743.5" stroke-width="46" />
    <path id="circular-cable" d="M 713.5139 670.1549 A 313.5 313.5 0 1 1 796.1275 562.4908" stroke-width="46" />
    <path id="terminal-chevron" d="M 591.5 356 L 665.75 426 L 591.5 496" stroke-width="44.25" />
    <path id="terminal-cursor" d="M 679 498 H 751.5" stroke-width="38.25" />
    <g id="cable-plug" transform="translate(733.1431 645.2086) rotate(-45.25)" fill="#101213" stroke="none">
      <rect x="-34.625" y="-32.625" width="69.25" height="65.25" rx="9" />
      <rect x="32.625" y="-19.75" width="37.5" height="39.5" rx="4" />
    </g>
  </g>
  </svg>