<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Writer · Bridge example</title><script type="module" src="/app.js"></script><style>
body{font:14px/1.6 system-ui,sans-serif;color:#e5e9ef;background:#11171d;max-width:540px;margin:12vh auto;padding:24px}h1{font-size:26px;font-weight:550}input,textarea,select,button{font:inherit;padding:9px 12px;border:1px solid #34424e;border-radius:6px;box-sizing:border-box}input,textarea{width:100%;margin:7px 0 14px}button{background:#a1d2ec;color:#101a23;cursor:pointer}button:disabled{opacity:.4}select{margin-right:8px}small{color:#9aa9b6}pre{white-space:pre-wrap;background:#1b242d;padding:15px;border-radius:6px}label{display:block;font-size:12px}#error{color:#efb59a}input,textarea,select{background:#1b242d;color:#e5e9ef}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #a1d2ec;outline-offset:3px}
</style></head><body><h1>Writer</h1><small>Local app example · Account: alice</small><p id="status">Not connected</p><button id="connect" hidden>Reconnect to development runner</button><p>Create an invitation in your isolated development panel. This example never launches the installed app.</p><details id="manual" open><summary>Connect with a development invitation</summary><form id="pair"><label>Bridge invitation<input id="invitation" required autocomplete="off"></label><button>Connect</button></form></details><section id="connected" hidden><button id="test">Test connection</button> <button id="new-chat">New chat</button> <button id="disconnect">Forget connection</button><form id="request"><label>Prompt<textarea id="prompt" rows="4" required></textarea></label><select id="provider" aria-label="Provider"><option value="codex">Codex</option><option value="claude">Claude Code</option></select><button>Send request</button></form><form id="command-request" hidden><h2>Commands</h2><label>Command<select id="command-select"></select></label><div id="command-inputs"></div><button>Run command</button></form><pre id="output" aria-live="polite">Ready.</pre><button id="cancel" disabled>Cancel request</button></section><p id="error" role="status"></p></body></html>
