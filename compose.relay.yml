services:
  wdc-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: wdc-relay:local
    ports: ["127.0.0.1:47323:8080"]
    environment:
      WDC_ADMIN_KEY_FILE: /run/secrets/admin_key
    secrets: [admin_key]
    volumes: [relay_data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 3
secrets:
  admin_key:
    file: ${WDC_ADMIN_KEY_FILE:?Set WDC_ADMIN_KEY_FILE to a private operator key file}
volumes:
  relay_data:
